<div id="ai-coach-container">
  <div id="ai-coach-hint" *ngIf="aiHint$ | async as hint">
    <div class="speech-bubble">
      {{hint}}
      <button (click)="applyAiSuggestion()" class="btn btn-secondary">
        Apply Ai Suggestion
      </button>
    </div>
  </div>

  <div
    (click)="onClick()"
    *ngIf="aiCoachState$ | async as state"
    id="ai-coach-image"
  >
    <img
      src="vendor/ai-coach/coach-neutral.svg"
      [@coachState]="state === 'neutral' ? 'visible' : 'hidden'"
      class="coach-image"
    />
    <img
      src="vendor/ai-coach/coach-thinking.svg"
      [@coachState]="state === 'thinking' ? 'visible' : 'hidden'"
      class="coach-image"
    />
    <img
      src="vendor/ai-coach/coach-idea.svg"
      [@coachState]="state === 'idea' ? 'visible' : 'hidden'"
      class="coach-image"
    />
  </div>
</div>
