  name: compiled
  value_before_type_cast: "SELECT track.name_de, race.place, player.name\nFROM race\n\tINNER
    JOIN player ON player.id = race.player_id\n\tINNER JOIN track ON track.id = race.track_id\n\tINNER
    JOIN track_cup ON track_cup.track_id = track.id\n\tINNER JOIN cup ON track_cup.cup_id
    = cup.id\nWHERE cup.name = 'Bananen-Cup'\n\tAND cup.ccm = race.ccm\nORDER BY track.name_de,
    race.place"
