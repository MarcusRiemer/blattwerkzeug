mutation AiHintCodeResource(
  $id: ID!
  $compiledSource: String!
  $lastDraggedBlock: String
  $clickedHoleText: String
) {
  aiHintCodeResource(
    input: {
      id: $id
      compiledSource: $compiledSource
      lastDraggedBlock: $lastDraggedBlock
      clickedHoleText: $clickedHoleText
    }
  ) {
    answerText
    nextBlock
    assignmentWithAccentuation
    suggestedHoleText
  }
}
